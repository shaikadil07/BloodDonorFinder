<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blood Donor Finder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#ff4d4d 0%,#9d0208 35%,#4a0000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Background Glow */

.bg-glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    filter:blur(80px);
    animation:glowMove 6s ease-in-out infinite alternate;
}

@keyframes glowMove{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(20px);
    }
}

/* Floating Particles */

.particle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(120vh);
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    to{
        transform:translateY(-120px);
        opacity:0;
    }
}

/* Main Container */

.container{
    text-align:center;
    z-index:10;
}

/* Premium Blood Logo */

.logo-wrapper{
    position:relative;
    width:180px;
    height:220px;
    margin:auto;
    animation:logoEntry 2s ease;
}

@keyframes logoEntry{

    0%{
        transform:translateY(-500px) scale(.2);
        opacity:0;
    }

    70%{
        transform:translateY(20px) scale(1.05);
    }

    100%{
        transform:translateY(0) scale(1);
        opacity:1;
    }
}

.logo-glow{
    position:absolute;
    width:220px;
    height:220px;
    left:-20px;
    top:0;
    border-radius:50%;
    background:rgba(255,80,80,.35);
    filter:blur(35px);
    animation:pulseGlow 2s infinite;
}

@keyframes pulseGlow{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }
}

/* Blood Shape */

.blood{

    position:absolute;

    width:140px;
    height:140px;

    background:
    linear-gradient(
    180deg,
    #ff8a8a,
    #ff2e2e,
    #b00020
    );

    left:20px;
    top:15px;

    border-radius:
    50% 50% 50% 0;

    transform:
    rotate(-45deg);

    box-shadow:
    0 0 25px rgba(255,0,0,.7),
    0 0 60px rgba(255,0,0,.5);

    animation:bloodPulse 2s infinite;
}

@keyframes bloodPulse{

    0%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.06);
    }

    100%{
        transform:rotate(-45deg) scale(1);
    }
}

/* Heart Inside */

.heart{
    position:absolute;
    color:white;
    font-size:46px;
    top:70px;
    left:68px;
    z-index:5;
    animation:heartBeat 1.2s infinite;
}

@keyframes heartBeat{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

/* Title */

.title{

    color:white;
    font-size:52px;
    font-weight:800;

    margin-top:20px;

    opacity:0;

    letter-spacing:2px;

    animation:titleReveal 2s forwards;
    animation-delay:1.6s;

    text-shadow:
    0 0 15px rgba(255,255,255,.4);
}

.subtitle{

    color:#ffe5e5;

    margin-top:10px;

    font-size:20px;

    opacity:0;

    animation:titleReveal 2s forwards;
    animation-delay:2.2s;
}

@keyframes titleReveal{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Loading Line */

.loader{

    width:260px;
    height:5px;

    margin:35px auto 0;

    background:rgba(255,255,255,.2);

    border-radius:20px;

    overflow:hidden;

    opacity:0;

    animation:showLoader .5s forwards;
    animation-delay:2.5s;
}

.loader span{

    display:block;

    width:0%;
    height:100%;

    background:white;

    animation:loading 3s forwards;
    animation-delay:2.8s;
}

@keyframes loading{
    from{
        width:0%;
    }
    to{
        width:100%;
    }
}

@keyframes showLoader{
    to{
        opacity:1;
    }
}

/* Light Sweep */

.sweep{
    position:absolute;
    width:300px;
    height:100vh;

    background:
    linear-gradient(
    to right,
    transparent,
    rgba(255,255,255,.2),
    transparent
    );

    transform:skewX(-20deg);

    left:-300px;

    animation:sweepMove 4s linear infinite;
}

@keyframes sweepMove{

    from{
        left:-300px;
    }

    to{
        left:130%;
    }
}

@media(max-width:768px){

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:15px;
    }

    .logo-wrapper{
        transform:scale(.85);
    }
}

</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="sweep"></div>

<!-- Particles -->

<div class="particle" style="left:10%;width:5px;height:5px;animation-duration:8s;"></div>
<div class="particle" style="left:20%;width:8px;height:8px;animation-duration:12s;"></div>
<div class="particle" style="left:35%;width:6px;height:6px;animation-duration:10s;"></div>
<div class="particle" style="left:50%;width:7px;height:7px;animation-duration:14s;"></div>
<div class="particle" style="left:70%;width:5px;height:5px;animation-duration:9s;"></div>
<div class="particle" style="left:85%;width:8px;height:8px;animation-duration:13s;"></div>

<div class="container">

    <div class="logo-wrapper">

        <div class="logo-glow"></div>

        <div class="blood"></div>

        <div class="heart">❤</div>

    </div>

    <h1 class="title">
        Blood Donor Finder
    </h1>

    <p class="subtitle">
        Connecting Donors. Saving Lives.
    </p>

    <div class="loader">
        <span></span>
    </div>

</div>

<script>

setTimeout(function(){

    window.location.href="login.html";

},6000);

</script>

</body>
</html>
