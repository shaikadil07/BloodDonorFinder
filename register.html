<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Donor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#e63946,#b00020);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:600px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.btn-register{
    background:#e63946;
    color:white;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
}

.btn-register:hover{
    background:#b00020;
}

.back-btn{
    text-decoration:none;
}

</style>

</head>
<body>

<div class="register-card">

    <div class="title">
        <h2>🩸 Become a Blood Donor</h2>
        <p>Register and help save lives.</p>
    </div>

    <form id="donorForm">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input
                type="text"
                class="form-control"
                id="name"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Blood Group</label>

            <select
                class="form-select"
                id="bloodGroup"
                required>

                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">City</label>
            <input
                type="text"
                class="form-control"
                id="city"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input
                type="tel"
                class="form-control"
                id="phone"
                required>
        </div>

        <button type="submit" class="btn-register">
            Register Donor
        </button>

    </form>

    <div class="text-center mt-4">

        <a href="index.html" class="back-btn">
            ← Back To Home
        </a>

    </div>

</div>

<script>

document
.getElementById("donorForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

let donor = {
    name: document.getElementById("name").value,
    bloodGroup: document.getElementById("bloodGroup").value,
    city: document.getElementById("city").value,
    phone: document.getElementById("phone").value,
    email: localStorage.getItem("userEmail")
};

    try{

        let response = await fetch(
            "http://localhost:8081/api/donors",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(donor)
            }
        );

        if(response.ok){

            alert("Donor Registered Successfully ✅");

            document.getElementById("donorForm").reset();

        }else{

            alert("Registration Failed ❌");

        }

    }
    catch(error){

        alert("Unable to connect to Spring Boot Server ❌");

        console.log(error);

    }

});

</script>

</body>
</html>
