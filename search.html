<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Blood Donor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f9fa;
}

.header{
    background:linear-gradient(to right,#e63946,#b00020);
    color:white;
    padding:50px 0;
    text-align:center;
}

.search-card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
    margin-top:-40px;
}

.donor-card{
    border:none;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.donor-card:hover{
    transform:translateY(-5px);
}

</style>

</head>
<body>

<div class="header">

    <h1>🔍 Find Blood Donors</h1>
    <p>Search donors by blood group and city</p>

</div>

<div class="container">

    <div class="search-card">

        <div class="row">

            <div class="col-md-5">

                <select class="form-select" id="bloodGroup">
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>

            </div>

            <div class="col-md-4">

                <input
                    type="text"
                    class="form-control"
                    id="city"
                    placeholder="Enter City">

            </div>

            <div class="col-md-3">

                <button
                    class="btn btn-danger w-100"
                    onclick="searchDonor()">
                    Search
                </button>

            </div>

        </div>

    </div>

    <div class="row mt-5" id="resultArea">

    </div>

</div>

<script>

const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:8081"
    : "https://blooddonorfinder-production.up.railway.app";

async function searchDonor() {

    let bloodGroup =
    document.getElementById("bloodGroup").value;

    let city =
    document.getElementById("city").value.trim();

    let resultArea =
    document.getElementById("resultArea");

    resultArea.innerHTML = "";

    if(bloodGroup === ""){
        alert("Please select a blood group");
        return;
    }

    try {

        let url;
        let encodedCity = encodeURIComponent(city);

        if(city === ""){

            url =
            `${API_BASE}/api/donors/${bloodGroup}`;

        }else{

            url =
            `${API_BASE}/api/donors/${bloodGroup}/${encodedCity}`;
        }

        let response = await fetch(url);

        let donors = await response.json();

        if(donors.length === 0){

            resultArea.innerHTML = `
            <div class="col-12">
                <div class="alert alert-warning">
                    No donors found.
                </div>
            </div>`;
            return;
        }

        donors.forEach(donor => {

            resultArea.innerHTML += `

            <div class="col-md-4 mb-4">

                <div class="card donor-card p-3">

                    <h4>🩸 ${donor.name}</h4>

                    <p><strong>Blood Group:</strong>
                    ${donor.bloodGroup}</p>

                    <p><strong>City:</strong>
                    ${donor.city}</p>

                    <p><strong>Phone:</strong>
                    ${donor.phone}</p>

                    <a href="tel:${donor.phone}"
                       class="btn btn-success">
                       Contact Donor
                    </a>

                </div>

            </div>

            `;
        });

    }
    catch(error){

        resultArea.innerHTML = `
        <div class="alert alert-danger">
            Unable to connect to Spring Boot Server ❌
        </div>`;

        console.log(error);
    }
}

</script>

</body>
</html>
