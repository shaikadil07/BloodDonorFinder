<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f9fa;
}

.header{
    background:#dc3545;
    color:white;
    padding:20px;
    text-align:center;
}

.card-box{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<div class="header">
    <h1>🩸 Blood Donor Dashboard</h1>
</div>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6 mb-4">

            <div class="card card-box p-4 text-center">

                <h2 id="donorCount">0</h2>
                <h5>Total Donors</h5>

            </div>

        </div>

        <div class="col-md-6 mb-4">

            <div class="card card-box p-4 text-center">

                <h2 id="requestCount">0</h2>
                <h5>Emergency Requests</h5>

            </div>

        </div>

    </div>

</div>

<script>

async function loadDashboard(){

    try{

        const donors =
        await fetch("http://localhost:8081/api/donors");

        const donorData =
        await donors.json();

        document
        .getElementById("donorCount")
        .innerText = donorData.length;

        const requests =
        await fetch("http://localhost:8081/api/requests");

        const requestData =
        await requests.json();

        document
        .getElementById("requestCount")
        .innerText = requestData.length;

    }
    catch(error){

        console.log(error);

    }
}

loadDashboard();

</script>

</body>
</html>
