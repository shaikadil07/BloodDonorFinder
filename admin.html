<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.navbar{
    background:#b00020;
}

.card-box{
    border:none;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

.table{
    margin-bottom:0;
}

</style>

</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand">
            🩸 Blood Donor Admin Dashboard
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card card-box p-4 text-center">
                <h2 id="donorCount">0</h2>
                <h5>Total Donors</h5>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card card-box p-4 text-center">
                <h2 id="requestCount">0</h2>
                <h5>Emergency Requests</h5>
            </div>
        </div>
    </div>

    <!-- Donor Table -->

    <div class="card card-box p-4 mb-4">

        <h3 class="mb-3">Registered Donors</h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-danger">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>City</th>
                        <th>Phone</th>
                    </tr>
                </thead>

                <tbody id="donorTable">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Request Table -->

    <div class="card card-box p-4">

        <h3 class="mb-3">Emergency Requests</h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-danger">
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Blood Group</th>
                        <th>City</th>
                        <th>Hospital</th>
                        <th>Phone</th>
                    </tr>
                </thead>

                <tbody id="requestTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

async function loadAdminData() {

    try {

        // Load Donors

        const donorResponse =
        await fetch("http://localhost:8081/api/donors");

        const donors =
        await donorResponse.json();

        document.getElementById("donorCount")
                .innerText = donors.length;

        let donorHTML = "";

        donors.forEach(donor => {

            donorHTML += `
            <tr>
                <td>${donor.id}</td>
                <td>${donor.name}</td>
                <td>${donor.bloodGroup}</td>
                <td>${donor.city}</td>
                <td>${donor.phone}</td>
            </tr>
            `;

        });

        document.getElementById("donorTable")
                .innerHTML = donorHTML;


        // Load Requests

        const requestResponse =
        await fetch("http://localhost:8081/api/requests");

        const requests =
        await requestResponse.json();

        document.getElementById("requestCount")
                .innerText = requests.length;

        let requestHTML = "";

        requests.forEach(request => {

            requestHTML += `
            <tr>
                <td>${request.id}</td>
                <td>${request.patientName}</td>
                <td>${request.bloodGroup}</td>
                <td>${request.city}</td>
                <td>${request.hospital}</td>
                <td>${request.phone}</td>
            </tr>
            `;

        });

        document.getElementById("requestTable")
                .innerHTML = requestHTML;

    }
    catch(error){

        console.log(error);

        alert("Unable to connect to Spring Boot Server");

    }

}

loadAdminData();

</script>

</body>
</html>
