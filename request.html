<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Blood Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#e63946,#b00020);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.request-card{
    background:white;
    width:100%;
    max-width:700px;
    padding:40px;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#e63946;
    font-weight:bold;
}

.btn-request{
    width:100%;
    background:#e63946;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.btn-request:hover{
    background:#b00020;
}

.back-link{
    text-decoration:none;
}

.alert-box{
    background:#fff3cd;
    border-left:5px solid #ffc107;
    padding:10px;
    border-radius:8px;
    margin-bottom:20px;
}

</style>

</head>
<body>

<div class="request-card">

    <div class="title">
        <h2>🚨 Emergency Blood Request</h2>
        <p>Submit an urgent blood requirement.</p>
    </div>

    <div class="alert-box">
        <strong>Important:</strong>
        Fill accurate details so donors can contact you quickly.
    </div>

    <form id="requestForm">

        <div class="mb-3">
            <label class="form-label">Request ID</label>
            <input
                type="number"
                class="form-control"
                id="id"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Patient Name</label>
            <input
                type="text"
                class="form-control"
                id="patientName"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Blood Group Needed</label>

            <select
                class="form-select"
                id="bloodGroup"
                required>

                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">City</label>
            <input
                type="text"
                class="form-control"
                id="city"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Hospital Name</label>
            <input
                type="text"
                class="form-control"
                id="hospital"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input
                type="tel"
                class="form-control"
                id="phone"
                required>
        </div>

        <button type="submit" class="btn-request">
            Submit Emergency Request
        </button>

    </form>

    <div class="text-center mt-4">

        <a href="index.html" class="back-link">
            ← Back To Home
        </a>

    </div>

</div>

<script>

document
.getElementById("requestForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

const request = {

    id: document.getElementById("id").value,
    patientName: document.getElementById("patientName").value,
    bloodGroup: document.getElementById("bloodGroup").value,
    city: document.getElementById("city").value,
    hospital: document.getElementById("hospital").value,
    phone: document.getElementById("phone").value,
    email: localStorage.getItem("userEmail")

};
    try{

        const response = await fetch(
            "http://localhost:8081/api/requests",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify(request)
            }
        );

        if(response.ok){
            let notifications =
JSON.parse(
localStorage.getItem("notifications"))
|| [];

notifications.push(
"🩸 Blood Request: "
+ request.patientName
+ " (" + request.bloodGroup + ")");

localStorage.setItem(
"notifications",
JSON.stringify(notifications));

            alert("Emergency Request Submitted Successfully 🚨");

            document
            .getElementById("requestForm")
            .reset();

        }else{

            alert("Request Submission Failed ❌");
        }

    }
    catch(error){

        alert("Unable to connect to Spring Boot Server ❌");
        console.log(error);

    }

});

</script>

</body>
</html>
