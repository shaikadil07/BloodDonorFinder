<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Donations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.navbar{
    background:#b00020;
}

.card-box{
    border:none;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand">
            🩸 My Donations
        </span>

        <a href="index.html" class="btn btn-light">
            Home
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card card-box p-4">

        <h3 class="mb-3">
            My Donation Details
        </h3>

        <table class="table table-bordered">

            <thead class="table-danger">
                <tr>
                    <th>Name</th>
                    <th>Blood Group</th>
                    <th>City</th>
                    <th>Phone</th>
                </tr>
            </thead>

           <tbody id="donationTable"></tbody>


        </table>

    </div>

</div>
<script>

async function loadMyDonations(){

    const email =
    localStorage.getItem("userEmail");

    try{

        const response =
        await fetch(
        "http://localhost:8081/api/mydonations/" + email);

        const donations =
        await response.json();

        let html = "";

        if(donations.length > 0){

            donations.forEach(donor => {

                html += `
                <tr>
                    <td>${donor.name}</td>
                    <td>${donor.bloodGroup}</td>
                    <td>${donor.city}</td>
                    <td>${donor.phone}</td>
                </tr>
                `;

            });

        }else{

            html = `
            <tr>
                <td colspan="4" class="text-center">
                    No Donations Found
                </td>
            </tr>
            `;

        }

        document.getElementById("donationTable")
                .innerHTML = html;

    }
    catch(error){

        console.log(error);

        alert("Unable to load donations");

    }

}

loadMyDonations();

</script>

</body>
</html>
