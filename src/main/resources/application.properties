spring.application.name=blooddonor

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/blooddonor;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER_CLASS_NAME:org.h2.Driver}}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true