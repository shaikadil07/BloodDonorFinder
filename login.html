<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Blood Donor Finder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
    135deg,
    #ff4d4d,
    #b00020,
    #5a0000
    );
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(50px);
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    bottom:-150px;
    right:-150px;
    filter:blur(50px);
}

.login-card{

    width:100%;
    max-width:450px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.2);

    border-radius:25px;

    padding:40px;

    color:white;

    box-shadow:0 10px 40px rgba(0,0,0,0.3);

    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    font-size:70px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    font-weight:bold;
}

.form-control{

    border:none;
    border-radius:12px;
    padding:12px;
}

.form-control:focus{
    box-shadow:none;
}

.btn-login{

    width:100%;
    background:white;
    color:#b00020;
    border:none;

    padding:12px;

    border-radius:12px;

    font-weight:bold;
}

.btn-login:hover{
    background:#f2f2f2;
}

.signup-link{
    color:white;
    text-decoration:none;
}

.google-btn{

    width:100%;
    margin-top:10px;

    border:none;

    padding:12px;

    border-radius:12px;

    background:#ffffff;

    color:#333;

    font-weight:bold;
}

.password-box{
    position:relative;
}

.eye-btn{

    position:absolute;
    right:10px;
    top:10px;

    cursor:pointer;

    color:#333;
}

@media(max-width:768px){

    .login-card{
        margin:20px;
        padding:30px;
    }

}

</style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        🩸
    </div>

    <div class="title">
        <h2>Blood Donor Finder</h2>
        <p>Login to continue</p>
    </div>

    <form id="loginForm">

        <div class="mb-3">

            <label>Email</label>

            <input
            type="email"
            id="email"
            class="form-control"
            required>

        </div>

        <div class="mb-3 password-box">

            <label>Password</label>

            <input
            type="password"
            id="password"
            class="form-control"
            required>

            <span
            class="eye-btn"
            onclick="togglePassword()">

            👁

            </span>

        </div>

        <div class="form-check mb-3">

            <input
            class="form-check-input"
            type="checkbox"
            id="rememberMe">

            <label
            class="form-check-label">

            Remember Me

            </label>

        </div>

        <button
        type="submit"
        class="btn-login">

        Login

        </button>

    </form>

    <div class="text-center mt-3">

        Don't have an account?

        <a
        href="signup.html"
        class="signup-link">

        Create Account

        </a>

    </div>

</div>

<script>

function togglePassword(){

    let password =
    document.getElementById("password");

    if(password.type==="password"){

        password.type="text";

    }else{

        password.type="password";

    }
}

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    try{

        const response =
        await fetch(
        "http://localhost:8081/api/login",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email:email,
                password:password
            })
        });

const user =
await response.json();

if(user != null){

    localStorage.setItem(
    "userName",
    user.name);

    localStorage.setItem(
    "userEmail",
    user.email);

    localStorage.setItem(
    "userPhone",
    user.phone);

    alert(
    "Welcome " + user.name + " ❤️");

    window.location.href =
    "index.html";
}
else{

    alert(
    "Invalid Email or Password ❌");
}

    }
    catch(error){

        alert(
        "Unable to connect to Spring Boot Server");

        console.log(error);

    }

});

</script>

</body>
</html>
